name: Update Homebrew Tap

on:
  release:
    types: [published]
  # Called by release.yml after it publishes a release (a release published by
  # GITHUB_TOKEN does not emit the `release` event to other workflows).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync into the tap, e.g. v2.4.0"
        required: true

jobs:
  update-tap:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
    permissions:
      contents: read
    steps:
      - name: Download DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --pattern "LlamaMate-*.dmg" \
            --dir ./artifacts \
            --repo "$GITHUB_REPOSITORY"
          ls -la artifacts/

      - name: Compute SHA256
        id: hash
        run: |
          set -euo pipefail
          DMG=$(ls artifacts/LlamaMate-*.dmg | head -1)
          if command -v sha256sum >/dev/null 2>&1; then
            SHA=$(sha256sum "$DMG" | awk '{print $1}')
          else
            SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "DMG: $DMG"
          echo "SHA256: $SHA"

      - name: Extract version
        id: version
        run: |
          TAG="${RELEASE_TAG#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clone tap repo
        env:
          TAP_REPO_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone https://x-access-token:${TAP_REPO_TOKEN}@github.com/Ito-69/homebrew-llamamate.git tap

      - name: Update cask
        env:
          SHA: ${{ steps.hash.outputs.sha }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd tap
          sed -i.bak \
            -e "s/^  version \".*\"/  version \"${VER}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
            Casks/llamamate.rb
          rm Casks/llamamate.rb.bak
          cat Casks/llamamate.rb

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Close any stale open bump PRs so they do not conflict with the new one
          gh pr list --repo Ito-69/homebrew-llamamate --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("bump-llamamate-")) | .number' | while read -r prnum; do
            echo "Closing stale PR #${prnum}"
            gh pr close "$prnum" --repo Ito-69/homebrew-llamamate --delete-branch || true
          done

          git branch -D "bump-llamamate-${VER}" 2>/dev/null || true
          git push origin --delete "bump-llamamate-${VER}" 2>/dev/null || true
          git checkout -b "bump-llamamate-${VER}"
          git add Casks/llamamate.rb
          git commit -m "llamamate ${VER}"
          git push -u origin "bump-llamamate-${VER}"

          gh pr create \
            --repo Ito-69/homebrew-llamamate \
            --head "bump-llamamate-${VER}" \
            --base main \
            --title "llamamate ${VER}" \
            --body "Automated update from llama.cpp_install_on_macos release v${VER}."

      - name: Auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Enable auto-merge so GitHub merges the PR as soon as it is mergeable,
          # instead of racing a fixed `sleep` against PR creation/mergeability.
          # Fall back to a bounded retry loop if auto-merge is not permitted.
          if ! gh pr merge "bump-llamamate-${VER}" \
                 --repo Ito-69/homebrew-llamamate \
                 --squash --delete-branch --auto; then
            for i in 1 2 3 4 5; do
              if gh pr merge "bump-llamamate-${VER}" \
                   --repo Ito-69/homebrew-llamamate \
                   --squash --delete-branch; then
                exit 0
              fi
              echo "merge attempt $i failed, retrying in 3s…"
              sleep 3
            done
            echo "ERROR: could not merge bump-llamamate-${VER}" >&2
            exit 1
          fi
