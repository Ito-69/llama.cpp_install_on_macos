name: Build Release

# Builds the universal LlamaMate.app + DMG on a macOS runner and attaches it to
# a DRAFT GitHub Release. Publishing the draft (by a person, in the GitHub UI)
# triggers update-homebrew-tap.yml, which bumps the Homebrew cask.
#
# Trigger: push a tag vX.Y.Z whose version matches VERSION in llamamate/build.sh,
# or run manually with an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v2.4.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches build.sh VERSION
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          BUILD_VER="$(sed -n 's/^VERSION="\(.*\)"/\1/p' llamamate/build.sh | head -1)"
          if [[ "$VER" != "$BUILD_VER" ]]; then
            echo "::error::Tag $TAG does not match llamamate/build.sh VERSION=$BUILD_VER"
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build app and DMG
        run: bash release.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP=llamamate/LlamaMate.app
          lipo -info "$APP/Contents/MacOS/llmctl"
          lipo -info "$APP/Contents/MacOS/llmctl" | grep -q arm64
          lipo -info "$APP/Contents/MacOS/llmctl" | grep -q x86_64
          codesign --verify --deep --verbose=2 "$APP"
          test -x "$APP/Contents/Resources/llama-server-start.sh"
          test -f "$APP/Contents/Resources/install-llama.sh"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist" | grep -qx "$VERSION"
          ls -la release-out/
          shasum -a 256 "release-out/LlamaMate-${VERSION}.dmg"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG="release-out/LlamaMate-${VERSION}.dmg"
          NOTES="release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            if [[ -f "$NOTES" ]]; then
              gh release create "$TAG" "$DMG" --draft --verify-tag --title "$TAG" --notes-file "$NOTES"
            else
              gh release create "$TAG" "$DMG" --draft --verify-tag --title "$TAG" --generate-notes
            fi
          fi
